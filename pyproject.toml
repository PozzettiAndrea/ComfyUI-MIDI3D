[project]
name = "comfyui-midi3d"
description = "ComfyUI wrapper for MIDI-3D: Multi-Instance Diffusion for single image to compositional 3D scene generation."
version = "0.0.1"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    # Core dependencies
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
    "trimesh>=4.0.0",
    "scikit-image>=0.20.0",

    # HuggingFace for model downloading
    "huggingface-hub",
    "diffusers>=0.25.0",
    "transformers>=4.40.0",

    # PyTorch ecosystem
    "einops",
    "peft",

    # Note: Additional dependencies should be installed with MIDI-3D
]

[project.urls]
Repository = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D"
Documentation = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D#readme"
"Bug Tracker" = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D/issues"

# ComfyUI Registry configuration
[tool.comfy]
PublisherId = "pznodes"
DisplayName = "MIDI-3D"
Icon = ""

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
