[project]
name = "comfyui-midi3d"
description = "THIS NODE IS WIP. ComfyUI wrapper for MIDI-3D: Multi-Instance Diffusion for single image to compositional 3D scene generation."
version = "0.0.1"
license = { text = "MIT" }
requires-python = ">=3.10"

dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D"
Documentation = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D#readme"
"Bug Tracker" = "https://github.com/PozzettiAndrea/ComfyUI-MIDI3D/issues"

# ComfyUI Registry configuration
[tool.comfy]
PublisherId = "pznodes"
DisplayName = "MIDI-3D"
Icon = ""

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
